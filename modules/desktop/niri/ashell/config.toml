language = "ru-RU"
region = "ru-RU"
position = "Bottom"
layer = "Bottom"
enable_esc_key = true

[modules]
left = [ "Workspaces" ]
center = [ "MediaPlayer" ]
right = [ "SystemInfo", "KeyboardLayout", "Tray", [ "Tempo", "Privacy", "Settings" ] ]

[workspaces]
visibility_mode = "MonitorSpecific"
group_by_monitor = true

[keyboard_layout.labels]
"English (US)" = "EN"
"Russian" = "RU"

[system_info]
indicators = [ "DownloadSpeed", "UploadSpeed" ]
interval = 1

[system_info.memory]
format = "Fraction"

[system_info.disk]
mounts = ["/persistent"]
format = "Fraction"

[tempo]
clock_format = "%a %d %b %R"
formats = [ "%d.%m.%Y %H:%M:%S" ]
weather_indicator = "None"

[settings]
indicators = ["IdleInhibitor", "Brightness", "Audio", "Microphone", "Bluetooth", "Network", "Vpn", "Battery"]
audio_indicator_format = "IconAndPercentage"
microphone_indicator_format = "IconAndPercentage"
brightness_indicator_format = "IconAndPercentage"
shutdown_cmd = "systemctl poweroff"
reboot_cmd = "systemctl reboot"
suspend_cmd = "systemctl suspend"

[appearance]
style = "Solid"
scale_factor = 1.2
success_color = "#a6d189"
warning_color = "#e5c890"
danger_color = "#e78284"
text_color = "#c6d0f5"
workspace_colors = [ "#babbf1", "#8caaee", "#f4b8e4" ]

[appearance.primary_color]
base = "#babbf1"
text = "#303446"

[appearance.background_color]
base = "#303446"
weak = "#414559"
strong = "#51576d"
